name: Deploy to VPS [pawnshop]

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.set.outputs.backend }}
      frontend: ${{ steps.set.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            backend:
              - 'api/**'
              - 'shared/**'
              - 'Dockerfile'
              - 'Dockerfile.dev'
              - 'package.json'
              - 'package-lock.json'
              - 'docker-compose.prod.yml'
              - '.github/workflows/deploy.yml'
            frontend:
              - 'web/**'
              - 'shared/**'
              - 'Dockerfile.web'
              - 'package.json'
              - 'package-lock.json'
              - 'docker-compose.prod.yml'
              - '.github/workflows/deploy.yml'

      - name: Set pipeline flags
        id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=${{ steps.filter.outputs.backend }}" >> "$GITHUB_OUTPUT"
            echo "frontend=${{ steps.filter.outputs.frontend }}" >> "$GITHUB_OUTPUT"
          fi

  backend_test:
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint backend paths
        run: npx eslint "api/src" "shared"

      - name: Run backend tests
        run: npm run test -w api

  frontend_test:
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npx eslint "web/src"

      - name: Build frontend (typecheck)
        run: npm run build -w web

  backend_build:
    needs: [changes, backend_test]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: ${{ github.workflow }}-backend-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/pawnshop-api:latest

  frontend_build:
    needs: [changes, frontend_test]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: ${{ github.workflow }}-frontend-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Require VITE build secrets
        run: |
          if [ -z "${{ secrets.VITE_API_BASE_URL }}" ]; then
            echo "VITE_API_BASE_URL secret must be a non-empty absolute API URL (e.g. https://portfolio.am-projects.ru/pawnshop/api/v1)"
            exit 1
          fi
          if [ -z "${{ secrets.VITE_BASE_PATH }}" ]; then
            echo "VITE_BASE_PATH secret must be a non-empty public path (e.g. /pawnshop/)"
            exit 1
          fi

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/pawnshop-web:latest
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_BASE_PATH=${{ secrets.VITE_BASE_PATH }}

  backend_deploy:
    needs: [changes, backend_build]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.PAWNSHOP_SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml"
          target: "/var/www/portfolio.am-projects.ru/pawnshop/"

      - name: Deploy backend to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.PAWNSHOP_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/portfolio.am-projects.ru/pawnshop/
            echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            docker pull ${{ secrets.DOCKER_USERNAME }}/pawnshop-api:latest
            export DOCKER_USERNAME='${{ secrets.DOCKER_USERNAME }}'
            docker compose -f docker-compose.prod.yml up -d migrations api
            docker image prune -f

  frontend_deploy:
    needs: [changes, frontend_build]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.PAWNSHOP_SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml"
          target: "/var/www/portfolio.am-projects.ru/pawnshop/"

      - name: Deploy frontend to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.PAWNSHOP_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/portfolio.am-projects.ru/pawnshop/
            echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            docker pull ${{ secrets.DOCKER_USERNAME }}/pawnshop-web:latest
            export DOCKER_USERNAME='${{ secrets.DOCKER_USERNAME }}'
            docker compose -f docker-compose.prod.yml up -d web
            docker image prune -f
